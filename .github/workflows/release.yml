# Version Packages PR on push to main; publish 0.x to the `next` dist-tag via
# npm trusted publishing (OIDC). No NPM_TOKEN. Workflow filename must stay
# release.yml so it matches the trusted publisher on npmjs.com.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: changesets/action@v2
        with:
          publish-script: npm run release
