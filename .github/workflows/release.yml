# Experimental releases only. Manual trigger; publishes 0.x under the `next`
# dist-tag with npm provenance. Needs an NPM_TOKEN secret (not set up yet).
name: Release (next)
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org }
      - run: npm ci
      - run: npm test && npm run build
      - run: npm publish -w astro-og-kit --tag next --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
