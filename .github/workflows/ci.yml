name: CI
# workflow_dispatch: GITHUB_TOKEN version-PR pushes do not start workflows.
# release.yml dispatches this onto changeset-release/* so the required `check` reports.
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run examples
      - name: Changeset when package source changes
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^packages/astro-og-kit/src/'; then
            npx changeset status --since="origin/${{ github.base_ref }}"
          else
            echo "No packages/astro-og-kit/src changes; changeset not required."
          fi
