# Squash-merge uses the PR title. pull_request (not pull_request_target) so this
# branch's workflow runs and we do not execute base-ref code.
name: PR title
on:
  pull_request:
    types: [edited, opened, reopened, synchronize]
permissions:
  pull-requests: read
jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            ci
            build
            revert
